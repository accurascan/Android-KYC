apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.accurascan.accurasdk.sample"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 51
        versionName "5.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            debuggable false      // production-ready
            minifyEnabled true    // enable shrinking/obfuscation
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/arm64-v8a/libcrypto.so', 'lib/arm64-v8a/libssl.so', 'lib/armeabi-v7a/libcrypto.so', 'lib/armeabi-v7a/libssl.so', 'lib/x86/libcrypto.so', 'lib/x86/libssl.so', 'lib/x86_64/libcrypto.so', 'lib/x86_64/libssl.so']
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }
    namespace 'com.accurascan.accurasdk.sample'

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'com.google.android.material:material:1.13.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    // For Accura OCR SDK
    implementation 'com.github.accurascan:AccuraOCR:6.2.5'
    // For Accura Face match
    implementation 'com.github.accurascan:AccuraFaceMatch:4.0.0'
    // for liveness
    implementation 'com.github.accurascan:Liveness-Android:3.8.1'
}
